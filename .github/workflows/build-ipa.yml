name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DriveLog.ipa
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (Liquid Glass needs the iOS 26 SDK)
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi -E "beta|release_candidate" | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$XCODE" ]; then
            echo "::error::这台 runner 上没有 Xcode 26，无法编译 Liquid Glass 界面"
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Unit tests (CostKit)
        run: swift test --package-path CostKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release · iphoneos · unsigned)
        run: |
          mkdir -p build
          if ! xcodebuild \
              -project DriveLog.xcodeproj \
              -scheme DriveLog \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build > build/xcodebuild.log 2>&1; then
            echo "================ BUILD FAILED ================"
            tail -n 60 build/xcodebuild.log
            echo "================ ERRORS ================"
            grep -E "(error|fatal error):" build/xcodebuild.log | sort -u | head -n 150
            exit 1
          fi
          echo "================ WARNINGS (unique) ================"
          grep -E "warning:" build/xcodebuild.log | grep -v "appintentsmetadataprocessor" | sort -u | head -n 80 || true
          tail -n 3 build/xcodebuild.log

      - name: Verify app bundle
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/DriveLog.app"
          echo "---- Info.plist (selected keys) ----"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleDisplayName|CFBundleIdentifier|MinimumOSVersion|UIBackgroundModes|\"location\"|UIFileSharingEnabled|LSSupportsOpeningDocumentsInPlace|NSLocationAlways|CFBundleIcon" || true
          plutil -extract UIBackgroundModes json -o - "$APP/Info.plist" | grep -q location
          echo "---- App Intents metadata ----"
          ls "$APP/Metadata.appintents"
          for intent in StartTripIntent StopTripIntent; do
            grep -q "$intent" "$APP/Metadata.appintents/extract.actionsdata" && echo "found $intent"
          done
          grep -q StartTripIntent "$APP/Metadata.appintents/extract.actionsdata"
          grep -q StopTripIntent "$APP/Metadata.appintents/extract.actionsdata"
          echo "---- Alternate icons ----"
          plutil -extract CFBundleIcons.CFBundleAlternateIcons json -o - "$APP/Info.plist"
          plutil -extract CFBundleIcons.CFBundleAlternateIcons json -o - "$APP/Info.plist" | grep -q "AppIcon-Odometer"
          echo "---- Assets ----"
          ls "$APP" | grep -E "Assets.car|AppIcon" || true
          test -f "$APP/Assets.car"

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DriveLog.app"
          test -d "$APP_PATH"
          rm -rf Payload DriveLog.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry DriveLog.ipa Payload
          ls -lh DriveLog.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveLog-ipa-${{ github.run_number }}
          path: DriveLog.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
